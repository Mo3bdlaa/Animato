android.nonTransitiveRClass=false

kotlin.code.style=official

# The package the installed app runs under.
#
# Read in two places, and they have to agree: :animato-app sets it as the real applicationId, and
# :app compiles it into BuildConfig.APPLICATION_ID, which is a constant its own code reads for
# things that must name the running app — the FileProvider authority, the package a Shizuku
# broadcast is addressed to, the package a Shizuku user service is bound under. Upstream those are
# the same string by construction because :app *is* the application there; here it is a library
# inside ours, so the string has to be handed to it.
animato.applicationId=io.github.mo3bdlaa.animato

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Skips the configuration phase entirely when nothing that feeds it has changed — 22 modules'
# worth. Measured on a no-op release build: 7s to 2s locally, and larger in CI, where every run
# starts with a cold daemon and pays the whole configuration cost.
#
# Verified against the real build rather than assumed: `:animato-app:assembleRelease` stores an
# entry and reuses it with no problems reported.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
