name: CI

permissions:
  contents: write

# Full release build: R8, signing, release creation. It is far more work than is needed to know
# whether a change compiles, so it runs on release tags and on demand only — quick_check.yml
# covers every push in a few minutes.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository allowed to publish signed releases. Change this (and nothing else) if the project
  # is ever renamed or transferred.
  RELEASE_REPO: Mo3bdlaa/Animato

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: ./gradlew :animato-app:assembleRelease

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: animato-${{ github.sha }}
          path: animato-app/build/outputs/apk/release/*.apk

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/') && github.repository == env.RELEASE_REPO
        run: echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      # Checks the secrets before signing rather than after, so a missing one or a mistyped alias
      # fails with a sentence instead of a stack trace. The alias check matters most: a keystore
      # made without keytool takes its alias from the certificate's friendly name, which is easy to
      # get wrong and impossible to inspect on a machine with no JDK.
      - name: Check signing secrets
        if: startsWith(github.ref, 'refs/tags/') && github.repository == env.RELEASE_REPO
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -e
          missing=""
          [ -z "$SIGNING_KEY" ] && missing="$missing SIGNING_KEY"
          [ -z "$ALIAS" ] && missing="$missing ALIAS"
          [ -z "$KEY_STORE_PASSWORD" ] && missing="$missing KEY_STORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See .github/RELEASING.md."
            exit 1
          fi

          echo "$SIGNING_KEY" | base64 -d > /tmp/check.ks 2>/dev/null || {
            echo "::error::SIGNING_KEY is not valid base64. Re-encode the keystore; see .github/RELEASING.md."
            exit 1
          }

          aliases=$(keytool -list -keystore /tmp/check.ks -storepass "$KEY_STORE_PASSWORD" 2>/dev/null \
            | grep -i 'PrivateKeyEntry' | cut -d, -f1) || true
          rm -f /tmp/check.ks

          if [ -z "$aliases" ]; then
            echo "::error::Could not read the keystore. KEY_STORE_PASSWORD is probably wrong."
            exit 1
          fi
          if ! printf '%s\n' "$aliases" | grep -qix "$ALIAS"; then
            echo "::error::ALIAS is '$ALIAS' but the keystore contains: $(printf '%s ' $aliases)"
            echo "::error::Set the ALIAS secret to one of those and re-run."
            exit 1
          fi
          echo "Signing key present, alias '$ALIAS' found."

      - name: Sign APK
        if: startsWith(github.ref, 'refs/tags/') && github.repository == env.RELEASE_REPO
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: animato-app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && github.repository == env.RELEASE_REPO
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Animato ${{ env.VERSION_TAG }}
          files: animato-app/build/outputs/apk/release/*-signed.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
