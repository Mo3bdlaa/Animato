name: Test build

# Produces an installable APK on demand, without tagging anything.
#
# The release pipeline only signs on a release tag, which makes it a poor way to get a build onto a
# phone for a quick look — tagging is a public act and a release is hard to take back. A debug build
# is signed with the standard Android debug key, so it installs with no secrets involved and nothing
# published.
#
# Note the consequence of that key: a debug build and a release build cannot replace each other.
# Android refuses an update signed by a different certificate, so moving between them means
# uninstalling first, which loses the app's data.
on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Architecture to build for'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal

jobs:
  build:
    name: Build ${{ inputs.abi }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Build debug APK
        run: ./gradlew :animato-app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: animato-debug-${{ inputs.abi }}
          path: animato-app/build/outputs/apk/debug/*-${{ inputs.abi }}-debug.apk
          if-no-files-found: error
          # Long enough to install and try; these are throwaway builds, not releases.
          retention-days: 7
