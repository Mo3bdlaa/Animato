name: Sync Mihon

# Pulls upstream Mihon into a branch and opens a pull request.
#
# This only works because this branch descends from Mihon's own history and we never edit Mihon's
# files: the merge touches nothing we own except the handful listed in ARCHITECTURE.md. A merge
# that reports conflicts outside that list means the boundary has been crossed somewhere, and the
# fix is to move that code into a module of ours — not to resolve the conflict and move on.
#
# A clean merge is not a green build. Mihon changing a signature we call is a compile error, which
# is the expected and wanted failure mode, so the pull request runs Quick check like any other.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Mihon ref to sync (branch or tag)'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-mihon
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  MIHON_REF: ${{ inputs.ref || 'main' }}

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Fetch Mihon
        run: |
          set -e
          git remote add mihon https://github.com/mihonapp/mihon.git || true
          git fetch --no-tags mihon "$MIHON_REF"

      - name: Check for new commits
        id: check
        run: |
          set -e
          behind=$(git rev-list --count HEAD..FETCH_HEAD)
          echo "behind=$behind" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short FETCH_HEAD)" >> $GITHUB_OUTPUT
          echo "Behind upstream by $behind commits."

      - name: Merge
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "mihon-sync/${{ steps.check.outputs.sha }}"
          git merge --no-edit FETCH_HEAD
          if [ $? -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "conflicts<<EOF" >> $GITHUB_OUTPUT
            echo "$conflicts" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "::warning::Merge conflicts in:"; echo "$conflicts"
            git merge --abort
            exit 0
          fi
          echo "clean=true" >> $GITHUB_OUTPUT

      - name: Report conflicts
        if: steps.merge.outputs.conflicts != ''
        run: |
          {
            echo "## Mihon sync needs a human"
            echo
            echo "Upstream is ${{ steps.check.outputs.behind }} commits ahead"
            echo "(\`${{ steps.check.outputs.sha }}\`). The merge conflicted in:"
            echo
            echo '```'
            echo "${{ steps.merge.outputs.conflicts }}"
            echo '```'
            echo
            echo "Files listed in ARCHITECTURE.md under *Files we own that live at Mihon's paths*"
            echo "are expected here — reconcile them by hand. Anything else means our code has"
            echo "leaked into Mihon's files and should be moved into a module of ours instead."
          } >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Push and open pull request
        if: steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The body lives in an env var rather than a heredoc inside `run`. A heredoc's contents
          # have to start at column 1 to avoid picking up indentation, and column 1 is outside the
          # block scalar — which made this file fail to parse as YAML at all.
          PR_BODY: |
            Merges upstream Mihon with no conflicts.

            A clean merge only means nothing we own was touched. It does **not** mean the app still
            builds: if Mihon changed a signature our code calls, Quick check on this pull request
            will say so, and that is the whole point of the boundary — breakage arrives as compile
            errors in our files rather than as merge conflicts in theirs.

            Do not merge until Quick check is green.
        run: |
          set -e
          branch="mihon-sync/${{ steps.check.outputs.sha }}"
          git push -u origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "Sync Mihon ${{ steps.check.outputs.sha }}" \
            --body "$PR_BODY"
