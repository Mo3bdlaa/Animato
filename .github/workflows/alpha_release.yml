name: Alpha release

permissions:
  contents: write

# Publishes a signed alpha to Releases, on demand.
#
# This exists because the two ways of getting a build onto a phone were both wrong for a work in
# progress. A workflow artifact is a zip that expires in a week and cannot be downloaded on a phone
# without a signed-in browser. A real release tag is a deliberate, public act.
#
# So: a prerelease, tagged automatically, signed with the real key, with the APKs attached directly.
# Downloadable on the phone, permanent, and marked prerelease so it never becomes "latest".
#
# build_push.yml is still the gate for actual versioned releases — it runs spotless and the unit
# tests first. This one only builds, because an alpha that takes half an hour to appear does not get
# used.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Anything worth testing beyond the commit list (optional)"
        required: false
        type: string

jobs:
  build:
    name: Build and publish alpha
    runs-on: ubuntu-latest

    # Asked of the event rather than compared against a repository named here.
    #
    # The name used to be written down, and the check was "am I that repository". That is the same
    # question in the case it was written for and the wrong question in every other: renaming the
    # project, or moving it to an organisation, turns the guard into a wall across the release path
    # — a workflow that refuses to publish the repository it is sitting in.
    #
    # `fork` is what was meant, and GitHub already answers it.
    steps:
      - name: Refuse to publish from a fork
        if: github.event.repository.fork
        run: |
          echo "::error::This is a fork. Releases are published from the upstream repository."
          exit 1

      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The whole history, because the release notes are written from it. The default shallow
          # clone has one commit and no tags, which is exactly the two things needed to answer
          # "what changed since the last alpha".
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      # Fails before the build rather than after it, and works out which alias to sign with.
      #
      # The alias is not a secret and not a choice — it is whatever label happens to be inside the
      # keystore. On the Windows-without-a-JDK path it is not even predictable: Export-PfxCertificate
      # ignores the certificate's -FriendlyName and writes the CNG key container name into the PKCS12
      # friendly-name attribute instead, so keytool reports something like
      # "te-2d68bf83-6d8c-469a-9713-0d94e8385975". Demanding that the ALIAS secret match it turns a
      # cosmetic detail into a failed release.
      #
      # So: one private key in the keystore means no ambiguity and the alias is read from it. The
      # ALIAS secret only has to resolve anything when there are several.
      - name: Check signing secrets
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -e
          missing=""
          [ -z "$SIGNING_KEY" ] && missing="$missing SIGNING_KEY"
          [ -z "$KEY_STORE_PASSWORD" ] && missing="$missing KEY_STORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See .github/RELEASING.md."
            exit 1
          fi

          echo "$SIGNING_KEY" | base64 -d > /tmp/check.ks 2>/dev/null || {
            echo "::error::SIGNING_KEY is not valid base64. Re-encode it; see .github/RELEASING.md."
            exit 1
          }
          aliases=$(keytool -list -keystore /tmp/check.ks -storepass "$KEY_STORE_PASSWORD" 2>/dev/null \
            | grep -i 'PrivateKeyEntry' | cut -d, -f1 | sed 's/[[:space:]]*$//') || true
          rm -f /tmp/check.ks

          if [ -z "$aliases" ]; then
            echo "::error::Could not read the keystore, or it holds no private key."
            echo "::error::KEY_STORE_PASSWORD is probably wrong. See .github/RELEASING.md."
            exit 1
          fi

          count=$(printf '%s\n' "$aliases" | grep -c .)
          if [ "$count" -eq 1 ]; then
            resolved=$(printf '%s\n' "$aliases" | head -1)
            if [ -n "$ALIAS" ] && ! printf '%s' "$resolved" | grep -qix "$ALIAS"; then
              echo "::warning::The ALIAS secret does not match the keystore, which holds exactly"
              echo "::warning::one key. Signing with that key. Set ALIAS to '$resolved' or clear it."
            fi
          else
            if [ -z "$ALIAS" ]; then
              echo "::error::The keystore holds $count keys: $(printf '%s ' $aliases)"
              echo "::error::Set the ALIAS secret to whichever one should sign the app."
              exit 1
            fi
            if ! printf '%s\n' "$aliases" | grep -qix "$ALIAS"; then
              echo "::error::ALIAS is not one of the keystore's $count keys: $(printf '%s ' $aliases)"
              exit 1
            fi
            resolved="$ALIAS"
          fi

          echo "resolved-alias=$resolved" >> "$GITHUB_OUTPUT"
          echo "Signing key present; signing with alias '$resolved'."

      # The run number is monotonic per workflow, so each alpha outranks the last and Android treats
      # it as an upgrade instead of refusing it as a downgrade. Offset well past the versionCode a
      # real release would use, so an alpha can never shadow one.
      #
      # ANIMATO_VERSION_NAME is the same string as the tag without its leading v, and it has to be:
      # the in-app updater compares the running build's versionName against the tags in Releases, so
      # a build that calls itself plain "0.1.0" can never be told apart from the alpha after it.
      - name: Name this build
        run: |
          echo "VERSION_TAG=v0.1.0-alpha.${{ github.run_number }}" >> $GITHUB_ENV
          echo "ANIMATO_VERSION_NAME=0.1.0-alpha.${{ github.run_number }}" >> $GITHUB_ENV
          echo "ANIMATO_VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))" >> $GITHUB_ENV

      # Twice: once for phones, once for televisions.
      #
      # The television build is the same source with `-Panimato-tv`, which leaves out the manga
      # reader's native libraries (about 16 MB on arm64 since Mihon dropped libvips, which was the
      # largest of them) and fixes the lens to anime so nothing asks for them.
      # See the comment on `isTvBuild` in animato-app/build.gradle.kts, including why this is a
      # property rather than a product flavour — a flavour would have renamed the variant tasks that
      # quick_check.yml and the five check scripts are keyed to.
      #
      # The second pass reuses the first's build cache for everything but packaging, so it is far
      # cheaper than twice the time. The output directory is the same, so the APKs are moved out
      # from under it between passes.
      - name: Build release APKs
        run: ./gradlew :animato-app:assembleRelease

      - name: Set the phone APKs aside
        run: |
          set -e
          mkdir -p staged/mobile
          cp animato-app/build/outputs/apk/release/*.apk staged/mobile/

      - name: Build the television APKs
        run: ./gradlew :animato-app:assembleRelease -Panimato-tv

      - name: Set the television APKs aside
        run: |
          set -e
          mkdir -p staged/tv
          cp animato-app/build/outputs/apk/release/*.apk staged/tv/

      - name: Sign the phone APKs
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: staged/mobile
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ steps.signing.outputs.resolved-alias }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      # The same key, deliberately. Both builds are the same app under one package name, so a
      # television that was sent a phone build once has to be able to take this one as an update.
      - name: Sign the television APKs
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: staged/tv
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ steps.signing.outputs.resolved-alias }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      # Four APKs: two architectures each for phones and televisions, which covers every physical
      # Android device — they are all ARM. The universal APK and the two x86 builds used to be
      # produced here too, 583 MB between them, signed and then either deleted or published for an
      # emulator nobody uses. See the splits block in animato-app/build.gradle.kts.
      #
      # The names put the variant AFTER the architecture — `…-arm64-v8a-tv.apk`. That is not a
      # style choice: the in-app updater matches on the end of the asset name, so a variant in the
      # middle would leave the television file ending in `-arm64-v8a.apk` exactly as the phone's
      # does, and phones would be offered a build with no manga reader in it. It also means every
      # build already installed keeps finding the right file without knowing televisions exist.
      # AnimatoAppUpdateChecker.downloadLinkFor has the rule, and three tests hold it in place.
      - name: Collect the APKs
        run: |
          set -e
          mkdir -p upload
          collect() {
            dir="$1"; suffix="$2"
            for abi in arm64-v8a armeabi-v7a; do
              src=$(ls "$dir"/*-"$abi"-release*-signed.apk 2>/dev/null | head -1)
              if [ -z "$src" ]; then
                echo "::error::No signed APK for $abi in $dir. It holds:"
                ls -la "$dir"
                exit 1
              fi
              cp "$src" "upload/animato-${VERSION_TAG}-${abi}${suffix}.apk"
            done
          }
          collect staged/mobile ""
          collect staged/tv "-tv"
          ls -la upload/

          # The television build is the whole point of the second pass, so a television APK that
          # came out the same size as the phone's means the exclusion did not apply and the saving
          # is imaginary. Cheaper to fail here than to find out from a download page.
          for abi in arm64-v8a armeabi-v7a; do
            phone=$(stat -c%s "upload/animato-${VERSION_TAG}-${abi}.apk")
            tv=$(stat -c%s "upload/animato-${VERSION_TAG}-${abi}-tv.apk")
            saved=$(( phone - tv ))
            echo "$abi: phone ${phone}, tv ${tv}, saved ${saved} bytes"
            # About 16 MB on arm64 and 12 on armeabi-v7a: the image decoder and the WebGPU viewer.
            # It was 28 MB until Mihon removed libvips, so the floor sits below the smaller ABI.
            if [ "$saved" -lt 8000000 ]; then
              echo "::error::The $abi television APK saved only ${saved} bytes; expected 12-16 MB."
              echo "::error::The jniLibs exclusion in animato-app/build.gradle.kts did not apply."
              exit 1
            fi
          done

      # What changed, written from the commits rather than from memory.
      #
      # This used to be a free-text input, and the input was left empty on almost every build — so
      # every release said only which commit it came from, and the in-app update dialog, which
      # shows this same text, said nothing at all about what it was offering. A note that depends
      # on somebody remembering is a note that is usually missing.
      #
      # Subjects only, and merges dropped. Commit subjects in this repo are written as sentences
      # about what changed and why, so the list reads as release notes without being rewritten
      # into them.
      - name: Write the release notes
        # Through the environment rather than interpolated into the script. A workflow input pasted
        # straight into shell breaks on the first apostrophe somebody types, and is a command
        # injection besides — the fact that only the owner can dispatch this is not a reason to
        # write it the wrong way.
        env:
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          previous=$(git tag --list 'v0.1.0-alpha.*' --sort=-version:refname | head -1)
          {
            echo "**What changed**"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous"..HEAD
            else
              # No previous alpha: the last handful, rather than the entire history of the project.
              git log --no-merges --format='- %s' -20
            fi
            echo
            if [ -n "$EXTRA_NOTES" ]; then
              echo "**Worth testing**"
              echo
              echo "$EXTRA_NOTES"
              echo
            fi
            echo "---"
            echo
            echo "Built from \`$GITHUB_SHA\`."
            echo
            echo "**On a phone:** \`arm64-v8a\` for anything from roughly 2017 onward, or"
            echo "\`armeabi-v7a\` if that one refuses to install."
            echo
            echo "**On a television or a TV box:** take a \`-tv\` file, and try"
            echo "\`armeabi-v7a-tv\` before \`arm64-v8a-tv\` — plenty of televisions run a 32-bit"
            echo "system on hardware that is physically 64-bit, and the 64-bit file then fails with"
            echo "nothing more than \"App not installed\"."
            echo
            echo "The \`-tv\` builds leave out the manga reader, which is 16 MB of native libraries"
            echo "for something nobody does with a remote control, and hide the manga half along"
            echo "with it. Everything else is identical. They still need Android 8.0 or newer."
            echo
            echo "Don't put a \`-tv\` build on a phone: it is the same app under the same name, so"
            echo "it installs happily and the manga half is simply gone."
            echo
            echo "**Coming from a debug build?** Uninstall it first. Android rejects an update"
            echo "signed by a different certificate, and this one is signed with the release key."
            echo "Uninstalling loses the app's data."
            echo
            echo "Alphas never become \"latest\" — this is marked as a prerelease on purpose."
          } > release-notes.md
          echo "--- notes ---"
          cat release-notes.md

      - name: Publish prerelease
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Animato ${{ env.VERSION_TAG }}
          files: upload/*.apk
          prerelease: true
          # A file rather than an inline block: the notes are generated, and the changes have to
          # come first — the in-app update dialog shows this whole body, so install instructions
          # above the list would be the first thing somebody reads about a new version.
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
