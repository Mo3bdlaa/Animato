name: Quick check

# Fast feedback while iterating: formatting, compilation and unit tests only — no packaging,
# no shrinking, no ABI splits. Compiling :animato-app pulls in every module, Mihon's included,
# so nothing escapes it. The full build runs on tags; see build_push.yml.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format and compile
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Compile
        run: ./gradlew :animato-app:compileReleaseKotlin

      # Compiling is not enough to know the app will start. Mihon's :app is a library here, and a
      # library ships different classes from the ones consumers compile against if anything shrinks
      # it — every call site still compiles, and the app dies at class-load time. That shipped once,
      # in v0.1.0-alpha.2. The script has the details.
      - name: Check :app ships the API we compile against
        run: ./.github/check-library-abi.sh

      # Compiling every module is also not enough to know they can be packaged together. Two
      # modules can each hold a copy of the same class and both compile; dex merging is where that
      # is rejected, and dex merging is not part of this lane. The script has the details.
      - name: Check no class is declared twice
        run: ./.github/check-duplicate-classes.sh

      # @Serializable without the compiler plugin is an annotation that generates nothing: the
      # module compiles, and the first encode or decode throws. It happened twice — the updater's
      # GitHub DTOs and the local anime metadata — and both times inside a catch.
      - name: Check @Serializable modules apply the plugin
        run: ./.github/check-serialization-plugin.sh

      # Injekt resolves by type at runtime, so a dependency nobody registers compiles perfectly and
      # throws when the screen that needs it opens. Eleven of them were found in the anime side at
      # once, having been written, compiled and merged without ever running. The script has the
      # details.
      - name: Check every Injekt dependency is registered
        run: ./.github/check-injekt-bindings.sh

      # A library Mihon compiles against can vanish from the app that ships it: the two are resolved
      # separately, and a version bump anywhere can drop a transitive dependency Mihon's code calls
      # into. Installing an extension died that way while every check above was green. The script
      # has the details.
      - name: Check nothing Mihon compiles against is missing at runtime
        run: ./.github/check-runtime-classpath.sh

      # R8 runs on the release build and removes anything it cannot see being used — which includes
      # every class only ever found by name: WorkManager's jobs, manifest components, and whatever
      # native code calls back into. Those fail on a device, in the one case that reaches them, so
      # the release APK is built here and asked what is actually in it. The script has the details.
      - name: Check R8 kept what is only reached by name
        run: ./.github/check-dex-keeps.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
