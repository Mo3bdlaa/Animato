name: Quick check

# Fast feedback while iterating: formatting, compilation and unit tests only — no packaging,
# no shrinking, no ABI splits. Compiling :animato-app pulls in every module, Mihon's included,
# so nothing escapes it. The full build runs on tags; see build_push.yml.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format and compile
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Compile
        run: ./gradlew :animato-app:compileReleaseKotlin

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
